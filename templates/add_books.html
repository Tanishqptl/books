<!DOCTYPE html>
<html>
<head>

<title>Add Book</title>

<link rel="stylesheet"
      href="{{ url_for('static',
      filename='style.css') }}">

</head>

<body>

<h1>Add Book</h1>

<form method="POST">

<input
type="text"
name="title"
placeholder="Book Title"
required>

<input
type="text"
name="author"
placeholder="Author"
required>

<textarea
name="description"
placeholder="Description"
required>
</textarea>

<button type="submit">
Save Book
</button>

</form>

</body>
</html>
