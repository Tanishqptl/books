<!DOCTYPE html>
<html>
<head>
    <title>Books Reader</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="page-shell">
    <header class="hero">
        <div class="hero-copy">
            <p class="eyebrow">Hello, Book Lover!</p>
            <h1>Books Reader</h1>
            <p class="hero-text">A refined reading dashboard with clean structure and book imagery layered into a professional, polished interface.</p>
            <a href="/add" class="btn">Add a new book</a>
        </div>
    </header>

    <main class="container">
        <section class="books">
            {% for book in books %}
            <article class="card">
                <h2>{{ book.title }}</h2>
                <p class="meta">Author: {{ book.author }}</p>
                <a href="/book/{{ book.id }}">Read more</a>
            </article>
            {% endfor %}
        </section>
    </main>
</div>

</body>
</html>
